services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kormo_mela
      POSTGRES_USER: kormo
      POSTGRES_PASSWORD: kormo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate && python manage.py seed_demo
      && python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://kormo:kormo@db:5432/kormo_mela
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  pgdata:
